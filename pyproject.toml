[project]
name = "skylorescriber"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

# The query layer, the tools and the whole gold set run with no dependencies at all --
# that is worth keeping, so the embedder is opt-in. ONNX Runtime rather than torch: the
# workload is 1020 vectors embedded once plus one short vector per query, which needs no
# GPU, and torch's Windows CUDA wheels are multi-gigabyte for nothing. Converting weights
# to ONNX needs torch once, on a developer machine, and never at runtime.
[project.optional-dependencies]
embed = [
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "numpy>=1.26",
]

# The agent is the one part that cannot run offline, so it is an extra for the same
# reason the embedder is: `python -m skylore.tools`, the gold set and every test still
# work with nothing installed. `-slim[openai]` rather than the full `pydantic-ai`, which
# pulls every provider's SDK; OpenAI's client also reaches OpenRouter, which speaks the
# same protocol.
agent = [
    # Not a floor picked for safety: `AgentRunResult.usage` is a property here and was a
    # method in earlier versions, and `Tool(description=...)` overriding the docstring is
    # what lets `tools.SCHEMAS` stay the single source of the text the model reads.
    "pydantic-ai-slim[openai]>=2.31",
    # For `skylore.web`, the optional Tavily search. Declared rather than borrowed from
    # pydantic-ai's own tree, and used instead of `tavily-python` because the whole
    # client is one POST -- and owning the request is what lets the result carry
    # `external: true` as a guarantee rather than a hope.
    "httpx>=0.27",
]
# `scripts.evaluate` -- the gold set against the six tools -- needs none of this and must
# keep needing none of it: it is the number that runs in CI, on a fork, without a key.
# This extra is for `scripts.evaluate_agent`, which judges the agent's prose with a
# model, and so cannot run offline or for free.
#
# Pinned to the exact minor of `pydantic-ai-slim` above rather than floored, because
# pydantic-evals depends on `pydantic-ai-slim==<its own version>` -- a `>=` here would
# let a resolver upgrade the agent's runtime as a side effect of installing its
# evaluation, which is the one dependency edge worth being strict about.
eval = [
    "pydantic-evals==2.31.*",
]

# `skylore.monitor`: what happened in production, written to Postgres and drawn by
# Grafana. Postgres rather than the sqlite this project uses everywhere else for one
# reason that is not about the data -- Grafana reads Postgres natively and sqlite only
# through a third-party plugin.
#
# `psycopg[binary]` rather than plain `psycopg`: the pure-Python build needs libpq and a
# compiler on the host, which is a poor first impression for a monitoring stack whose
# whole promise is one command. Streamlit is here rather than in `agent` because the
# agent is perfectly usable from a terminal and 40 MB of web framework should not be the
# price of asking it a question.
monitor = [
    "psycopg[binary]>=3.2",
    "streamlit>=1.40",
]
